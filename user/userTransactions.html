<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Crafts - Transaction History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=The+Seasons&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="css/pendingOrders.css">
    <link rel="stylesheet" href="css/userTransactions.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo-area">
                <img src="../pictures/IFCLogo.jpg" alt="IFC Crafts Logo" class="nav-logo">
                <span class="brand-name">IFC CRAFTS</span>
            </div>
            
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav class="nav-links">
                <a href="../index.html">HOME</a>
                <a href="../products.html">PRODUCTS</a>
                <a href="../services.html">SERVICES</a>
                <a href="../reviews.html">REVIEWS</a>
            </nav>

            <div class="nav-right-actions">
                <button type="button" class="nav-icon-btn notification-bell-btn" id="notifModalBtn" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notif-badge" id="navNotifBadge" style="display: none;">0</span>
                </button>
                <a href="userCart.html" class="nav-icon-btn" title="Shopping Cart">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <a href="profile.html" class="profile-icon-only" title="User Profile">
                    <i class="fas fa-user"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Notification List Modal -->
    <div class="notif-modal-overlay" id="notifModalOverlay">
        <div class="notif-modal-content">
            <div class="notif-modal-header">
                <h3>Notifications</h3>
                <button type="button" class="close-notif-modal" id="closeNotifModal">&times;</button>
            </div>
            <div class="notif-modal-body" id="notifModalList">
                <div class="empty-notif-message">No notifications found.</div>
            </div>
        </div>
    </div>

    <!-- Detailed Notification Modal -->
    <div class="notif-modal-overlay" id="detailNotifModalOverlay" style="z-index: 1200;">
        <div class="notif-modal-content">
            <div class="notif-modal-header">
                <h3 id="detailNotifTitle">Notification Details</h3>
                <button type="button" class="close-notif-modal" id="closeDetailModal">&times;</button>
            </div>
            <div class="notif-modal-body" style="display: flex; flex-direction: column; gap: 15px;">
                <p id="detailNotifMessage" style="font-family: 'Inter', sans-serif; font-size: 0.95rem; color: #334155; line-height: 1.5; margin: 0;"></p>
                <span id="detailNotifTime" style="font-family: 'Inter', sans-serif; font-size: 0.75rem; color: #94a3b8;"></span>
            </div>
        </div>
    </div>

    <!-- Order Receipt Modal -->
    <div class="notif-modal-overlay" id="orderReceiptModalOverlay" style="z-index: 1300;">
        <div class="notif-modal-content" style="max-width: 480px;">
            <div class="notif-modal-header">
                <h3>Order Summary</h3>
                <button type="button" class="close-notif-modal" id="closeReceiptModal">&times;</button>
            </div>
            <div class="notif-modal-body" id="receiptModalBody" style="display: flex; flex-direction: column; gap: 12px;">
                <!-- Dynamic receipt summary format -->
            </div>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div class="dashboard-wrapper">
        
        <aside class="dashboard-sidebar">
            <div class="sidebar-menu-group">
                <a href="userDashboard.html" class="sidebar-item">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="userOrder.html" class="sidebar-item">
                    <i class="fas fa-clipboard-list"></i> Orders
                </a>
                <a href="pendingOrders.html" class="sidebar-item">
                    <i class="fas fa-clock"></i> Pending Orders
                </a>
                <a href="userTransactions.html" class="sidebar-item active">
                    <i class="fas fa-file-invoice-dollar"></i> Transactions
                </a>
                <a href="userMessage.html" class="sidebar-item">
                    <i class="fas fa-comments"></i> Messages
                </a>
                <a href="profile.html" class="sidebar-item">
                    <i class="fas fa-user-circle"></i> Profile
                </a>
            </div>
            
            <div style="padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.08);">
                <a href="#" id="logoutBtn" class="sidebar-item logout-btn" style="color: #dc3545; background-color: #fff5f5;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <main class="dashboard-main-content">
            <div class="transaction-container-box">
                <div class="transaction-main-header">
                    <h1>Transaction History</h1>
                    <p>View your past orders and transaction details.</p>
                </div>

                <div class="transaction-toolbar">
                    <div class="search-bar-wrapper">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="transactionSearch" placeholder="Search Transaction..." class="search-input">
                    </div>
                    <a href="../orders.html" class="view-all-transactions">View all <i class="fas fa-arrow-right" style="font-size: 0.75rem;"></i></a>
                </div>

                <div class="transactions-list" id="transactionsListContainer">
                    <!-- Dynamic Transactions injected via JS -->
                </div>
            </div>
        </main>
    </div>

    <script>
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('menu-toggle').checked = false;
            });
        });

        const notifBtn = document.getElementById('notifModalBtn');
        const notifOverlay = document.getElementById('notifModalOverlay');
        const closeNotifBtn = document.getElementById('closeNotifModal');
        const detailOverlay = document.getElementById('detailNotifModalOverlay');
        const closeDetailBtn = document.getElementById('closeDetailModal');
        const receiptOverlay = document.getElementById('orderReceiptModalOverlay');
        const closeReceiptBtn = document.getElementById('closeReceiptModal');

        if (notifBtn) notifBtn.addEventListener('click', () => { notifOverlay.style.display = 'flex'; loadModalNotifications(); });
        if (closeNotifBtn) closeNotifBtn.addEventListener('click', () => { notifOverlay.style.display = 'none'; });
        if (closeDetailBtn) closeDetailBtn.addEventListener('click', () => { detailOverlay.style.display = 'none'; });
        if (closeReceiptBtn) closeReceiptBtn.addEventListener('click', () => { receiptOverlay.style.display = 'none'; });

        window.addEventListener('click', (e) => {
            if (e.target === notifOverlay) notifOverlay.style.display = 'none';
            if (e.target === detailOverlay) detailOverlay.style.display = 'none';
            if (e.target === receiptOverlay) receiptOverlay.style.display = 'none';
        });

        document.addEventListener("DOMContentLoaded", () => {
            const logoutBtnEl = document.getElementById('logoutBtn');
            if (logoutBtnEl) {
                logoutBtnEl.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('isLoggedIn');
                    localStorage.removeItem('ifc_user_firstname');
                    window.location.href = '../index.html';
                });
            }

            loadAndRenderTransactions();
            const notifications = JSON.parse(localStorage.getItem('ifc_user_notifications')) || [];
            updateNotificationBadge(notifications);
        });

        function loadAndRenderTransactions() {
            const container = document.getElementById('transactionsListContainer');
            const storedTransactions = JSON.parse(localStorage.getItem('ifc_user_transactions')) || [];

            container.innerHTML = '';
            if (storedTransactions.length === 0) {
                container.innerHTML = `<div style="padding: 30px; text-align: center; color: #64748b; font-family: 'Inter', sans-serif;">No transaction history found.</div>`;
                return;
            }

            storedTransactions.forEach(tx => {
                const status = tx.status || 'completed';
                const displayStatus = status.charAt(0).toUpperCase() + status.slice(1);

                const card = document.createElement('div');
                card.className = 'transaction-card-item';
                card.setAttribute('data-id', tx.id);
                card.setAttribute('data-date', tx.date);
                card.setAttribute('data-product', tx.product || tx.name);
                card.setAttribute('data-craft', tx.craft || 'Handmade Craft');
                card.setAttribute('data-qty', tx.qty || tx.quantity || 1);
                card.setAttribute('data-price', tx.price || tx.total);
                card.setAttribute('data-status', status);
                card.setAttribute('data-shipping', tx.shipping || 'Taytay, Rizal');
                card.setAttribute('data-payment', tx.payment || 'GCash');
                card.setAttribute('data-image', tx.image || '../pictures/necklace.jpg');

                card.innerHTML = `
                    <div class="tx-card-header">
                        <span class="order-id-label">Order# ${tx.id}</span>
                        <span class="tx-date">${tx.date}</span>
                    </div>
                    <div class="tx-card-body">
                        <div class="product-preview">
                            <img src="${tx.image || '../pictures/necklace.jpg'}" alt="${tx.product || tx.name}" class="tx-product-img" onerror="this.src='../pictures/necklace.jpg'">
                            <div class="tx-product-info">
                                <h3>${tx.product || tx.name}</h3>
                                <p class="craft-type">${tx.craft || 'Handmade Craft'}</p>
                                <p class="qty-text">Qty.: ${tx.qty || tx.quantity || 1}</p>
                            </div>
                        </div>
                        <div class="tx-card-meta">
                            <div class="total-price-group">
                                <span class="total-label">Total:</span>
                                <span class="total-amount">${tx.price || tx.total}</span>
                            </div>
                            <div class="tx-action-group">
                                <span class="status-badge ${status}">${displayStatus}</span>
                                <a href="#" class="view-details-link">View Details</a>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            initSearchAndModalListeners();
        }

        function initSearchAndModalListeners() {
            const searchInput = document.getElementById('transactionSearch');
            const transactionCards = document.querySelectorAll('.transaction-card-item');

            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.toLowerCase().trim();
                    transactionCards.forEach(card => {
                        const textContent = card.textContent.toLowerCase();
                        card.style.display = textContent.includes(searchTerm) ? 'block' : 'none';
                    });
                });
            }

            document.querySelectorAll('.view-details-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const card = e.target.closest('.transaction-card-item');
                    const id = card.getAttribute('data-id');
                    const date = card.getAttribute('data-date');
                    const product = card.getAttribute('data-product');
                    const craft = card.getAttribute('data-craft');
                    const qty = card.getAttribute('data-qty');
                    const price = card.getAttribute('data-price');
                    const status = card.getAttribute('data-status');
                    const shipping = card.getAttribute('data-shipping');
                    const payment = card.getAttribute('data-payment');
                    const image = card.getAttribute('data-image');
                    const displayStatus = status ? status.charAt(0).toUpperCase() + status.slice(1) : 'Completed';

                    const rawPriceStr = price ? price.replace(/[^\d.]/g, '') : '0';
                    const totalPrice = parseFloat(rawPriceStr) || 0;
                    let vatAmount = totalPrice * 0.12;
                    let subtotal = totalPrice - vatAmount;

                    const receiptBody = document.getElementById('receiptModalBody');
                    receiptBody.innerHTML = `
                        <div style="border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; margin-bottom: 5px;">
                            <p style="margin: 0; font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #64748b;">Order ID: <strong>#${id}</strong></p>
                            <p style="margin: 0; font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #64748b;">Date: ${date}</p>
                            <p style="margin: 0; font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #64748b;">Status: <span class="status-badge ${status}" style="display: inline-block; padding: 2px 8px; font-size: 0.75rem;">${displayStatus}</span></p>
                        </div>

                        <div style="background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                            <div style="font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; color: #334155;">
                                <i class="fas fa-box-open"></i> Product Information
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <img src="${image}" alt="Product" style="width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0;">
                                <div>
                                    <h4 style="margin: 0; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 600; color: #000;">${product}</h4>
                                    <p style="margin: 2px 0 0; font-family: 'Inter', sans-serif; font-size: 0.8rem; color: #64748b;">Craft: ${craft} | Qty: ${qty}</p>
                                </div>
                            </div>
                        </div>

                        <div style="background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px;">
                                <span>Subtotal</span>
                                <span>₱${subtotal.toFixed(2)}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                                <span>VAT (12%)</span>
                                <span>₱${vatAmount.toFixed(2)}</span>
                            </div>
                        </div>

                        <div style="background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                            <div style="font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; color: #334155;">
                                <i class="fas fa-truck"></i> Delivery Information
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px;">
                                <span>Delivery Method</span>
                                <span>Meet-up</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                                <span>Location</span>
                                <span>${shipping}</span>
                            </div>
                        </div>

                        <div style="background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                            <div style="font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; color: #334155;">
                                <i class="fas fa-credit-card"></i> Payment Information
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                                <span>Method</span>
                                <strong style="text-transform: uppercase;">${payment}</strong>
                            </div>
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid #e2e8f0; font-size: 1rem;">
                            <strong style="color: #000;">Total Amount</strong>
                            <strong style="color: #2e7d32; font-size: 1.1rem;">${price}</strong>
                        </div>
                    `;

                    receiptOverlay.style.display = 'flex';
                });
            });
        }

        function loadModalNotifications() {
            let notifications = JSON.parse(localStorage.getItem('ifc_user_notifications')) || [];
            const notifListContainer = document.getElementById('notifModalList');
            if (notifications.length === 0) {
                notifListContainer.innerHTML = `<div class="empty-notif-message">No notifications found.</div>`;
                return;
            }
            notifListContainer.innerHTML = '';
            notifications.forEach((notif, index) => {
                const div = document.createElement('div');
                div.className = `notif-item-popup ${notif.unread ? 'unread' : ''}`;
                div.innerHTML = `
                    <div class="notif-title">${notif.title || 'Notification'}</div>
                    <div class="notif-desc">${notif.message || notif.desc}</div>
                    <div class="notif-time">${notif.time || 'Just now'}</div>
                `;
                div.addEventListener('click', () => {
                    document.getElementById('detailNotifTitle').textContent = notif.title || 'Notification Details';
                    document.getElementById('detailNotifMessage').textContent = notif.message || notif.desc || 'No message available.';
                    document.getElementById('detailNotifTime').textContent = notif.time || 'Just now';
                    detailOverlay.style.display = 'flex';
                    if (notif.unread) {
                        notif.unread = false;
                        notifications[index] = notif;
                        localStorage.setItem('ifc_user_notifications', JSON.stringify(notifications));
                        div.classList.remove('unread');
                        updateNotificationBadge(notifications);
                    }
                });
                notifListContainer.appendChild(div);
            });
        }

        function updateNotificationBadge(notifications) {
            const unreadCount = notifications.filter(n => n.unread === true).length;
            const badge = document.getElementById('navNotifBadge');
            if (unreadCount > 0) {
                badge.textContent = unreadCount;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }
    </script>
</body>
</html>
